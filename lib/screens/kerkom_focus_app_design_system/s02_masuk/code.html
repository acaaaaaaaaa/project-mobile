<div class="flex flex-col pt-2 mb-8">
<div class="mb-5 flex items-center">
<img alt="kerkom" class="w-[130px] h-auto object-contain block" src="https://lh3.googleusercontent.com/aida/AEtjO1VLjAU5UZ-5V-fqkPIiv6R-1YKZ0PJ42d2uFrh__6E5dO1ll0Y83RzOm1Vami5r7ebkioUZIhlGf-5_lOtRCZWDtERkE-uvsLRHI8gEWqRSgTyFV7uRlfs9txEMDg33YXUbn6eE0iPGkiOTBwD8Xi6ZzdYdbt9WN_SOxfkvhXk7m3-joIk_Ypb1O_CjJxq9odFIqYjyG1frV3gWJTzdPrq6x2Ogalx643IoKd9dZyL5EFtvJz04isMeLsft"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
      Taruh HP, selesaikan tugas bareng
    </h1>
<p class="font-body-md text-body-md text-secondary mt-1.5">
      Sesi fokus kelompok akademik tanpa distraksi digital.
    </p>
</div>
<div class="bg-surface-container-low rounded-2xl p-5 mb-6">
<form class="flex flex-col" id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest mb-2" for="emailInput">
          Email
        </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-[52px] bg-surface-container text-primary font-body-md text-body-md rounded-xl px-4 placeholder:text-secondary-container outline-none transition-colors duration-150 focus:bg-surface-container-high" id="emailInput" placeholder="nama@kampus.ac.id" type="email" value="raditya@ugm.ac.id"/>
</div>
</div>
<div class="flex flex-col mt-4">
<div class="flex items-center justify-between mb-2">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-widest" for="passwordInput">
            Password
          </label>
<button class="font-label-sm text-label-sm text-primary-fixed hover:underline outline-none" type="button">
            Lupa?
          </button>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-[52px] bg-surface-container text-primary font-body-md text-body-md rounded-xl pl-4 pr-12 placeholder:text-secondary-container outline-none transition-colors duration-150 focus:bg-surface-container-high" id="passwordInput" placeholder="••••••••" type="password" value="kuncirahasia"/>
<button aria-label="Tampilkan sandi" class="absolute right-3 w-10 h-10 flex items-center justify-center text-secondary hover:text-primary transition-colors outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 mt-3 text-error" id="errorAlert">
<span class="material-symbols-outlined text-[18px]">error</span>
<span class="font-body-sm text-body-sm text-error">
          Email atau password salah. Cek kredensial Anda.
        </span>
</div>
<button class="w-full h-[52px] rounded-xl bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg mt-6 flex items-center justify-center tracking-normal active:translate-y-[3px] active:shadow-[0_1px_0_#9EC41C] transition-all" id="submitBtn" style="box-shadow: 0 4px 0 #9EC41C;" type="submit">
        Masuk
      </button>
</form>
</div>
<div class="flex items-center my-2">
<div class="flex-1 h-[1px] bg-surface-variant"></div>
<span class="font-label-sm text-label-sm uppercase tracking-widest text-secondary px-4">atau</span>
<div class="flex-1 h-[1px] bg-surface-variant"></div>
</div>
<button class="w-full h-[52px] rounded-xl bg-primary text-surface font-label-lg text-label-lg mt-4 flex items-center justify-center gap-3 transition-opacity active:opacity-90" type="button">
<svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
<span>Lanjut dengan Google</span>
</button>
<div class="mt-8 flex items-center justify-center gap-1.5 text-center">
<span class="font-body-md text-body-md text-secondary">Belum punya akun?</span>
<button class="font-label-md text-label-md text-primary-fixed underline decoration-primary-fixed underline-offset-4 outline-none" type="button">
      Daftar
    </button>
</div>
</div>
<script>
  (function() {
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');

    if (toggleBtn && pwdInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    window.handleLogin = function() {
      const err = document.getElementById('errorAlert');
      if (err) {
        err.classList.remove('hidden');
        err.classList.add('flex');
      }
    };
  })();
</script></main></body></html>
