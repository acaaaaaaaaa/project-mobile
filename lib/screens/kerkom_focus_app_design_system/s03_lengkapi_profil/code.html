</div>
</div>

<div class="mt-6 flex flex-col items-center w-full">
<div class="relative flex items-center justify-center">

</div>
<div class="absolute bottom-0 right-0 w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-md p-1.5 transform translate-x-1 translate-y-1">
<svg class="w-full h-full" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>

</div>
</div>
<div class="mt-8 w-full flex flex-col">
<label class="font-label-sm text-label-sm text-secondary uppercase tracking-wider mb-2" for="display-name">
          Nama tampilan
        </label>
<div class="relative w-full">
<input autocomplete="name" class="w-full h-[52px] bg-surface-container rounded-xl px-4 font-body-lg text-body-lg text-primary font-bold outline-none focus:bg-surface-container-high transition-colors text-ellipsis" id="display-name" type="text" value="Dimas Pratama"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-secondary">
<span class="material-symbols-outlined text-[20px]">badge</span>
</div>
</div>
<div class="flex items-center gap-1.5 mt-2.5 px-0.5">
<span class="material-symbols-outlined text-secondary text-[16px]">visibility</span>
<p class="font-body-sm text-body-sm text-secondary">Nama ini yang dilihat teman sekelompokmu</p>
</div>
</div>
<div class="w-full bg-surface-container-low rounded-xl p-4 mt-6 flex items-start gap-3">
<span class="material-symbols-outlined text-secondary text-[20px] mt-0.5 shrink-0">info</span>
<p class="font-body-sm text-body-sm text-secondary leading-relaxed">
          Foto dan nama diambil otomatis dari akun Google kampusmu.
        </p>
</div>
<div class="w-full bg-surface-container-low/50 rounded-xl p-3.5 mt-3 flex items-center justify-between">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-primary-fixed text-[18px]">lock</span>
<span class="font-body-sm text-body-sm text-secondary">Mode Fokus Terikat Akun</span>
</div>
<span class="font-label-sm text-label-sm text-primary-fixed uppercase tracking-wider font-extrabold">Aktif</span>
</div>
</div>
</div>
<div class="w-full pt-4 pb-2">
<button class="w-full h-[52px] rounded-[16px] bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center font-extrabold select-none active:translate-y-[3px] transition-transform duration-700 cursor-pointer" id="btn-save-profile" onmousedown="this.style.boxShadow='0 1px 0 #9EC41C'" onmouseup="this.style.boxShadow='0 4px 0 #9EC41C'" ontouchend="this.style.boxShadow='0 4px 0 #9EC41C'" ontouchstart="this.style.boxShadow='0 1px 0 #9EC41C'" style="box-shadow: 0 4px 0 #9EC41C;" type="button">
      Simpan
    </button>
</div>
</div>
<script>
  (function() {
    const saveBtn = document.getElementById('btn-save-profile');
    const input = document.getElementById('display-name');

    if (saveBtn && input) {
      saveBtn.addEventListener('click', function() {
        const trimmed = input.value.trim();
        if (!trimmed) {
          input.focus();
          return;
        }
        saveBtn.classList.add('opacity-80');
        saveBtn.innerText = 'Menyimpan...';
        setTimeout(function() {
          saveBtn.innerText = 'Tersimpan';
        }, 350);
      });
    }
  })();
</script></main></body></html>
