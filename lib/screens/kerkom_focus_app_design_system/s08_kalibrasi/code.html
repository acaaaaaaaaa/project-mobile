<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;800;900&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;min-height:100vh;margin:0;padding:0;background-color:#111317;color:#e2e2e8;overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pl-safe{padding-left:env(safe-area-inset-left,0px);}.pr-safe{padding-right:env(safe-area-inset-right,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary": "#ffffff", "surface-container-high": "#282a2e", "surface-container": "#1e2024", "primary-fixed": "#c5f331", "on-tertiary-container": "#c31f29", "on-error-container": "#ffdad6", "surface-variant": "#333539", "on-secondary-container": "#b3b5be", "on-background": "#e2e2e8", "on-secondary-fixed-variant": "#44474f", "surface-container-lowest": "#0c0e12", "tertiary-fixed-dim": "#ffb3ae", "surface": "#111317", "on-surface": "#e2e2e8", "secondary": "#c4c6d0", "background": "#111317", "on-error": "#690005", "inverse-primary": "#506600", "surface-container-highest": "#333539", "tertiary-container": "#ffdad7", "on-tertiary-fixed-variant": "#930014", "on-secondary-fixed": "#191c22", "surface-container-low": "#1a1c20", "on-primary-fixed": "#161f00", "error": "#ffb4ab", "primary-fixed-dim": "#aad600", "tertiary-fixed": "#ffdad7", "secondary-fixed": "#e0e2ec", "on-surface-variant": "#c4c9ae", "on-primary": "#283500", "on-primary-fixed-variant": "#3b4d00", "on-secondary": "#2d3038", "primary-container": "#c5f331", "surface-bright": "#37393e", "inverse-on-surface": "#2f3035", "surface-tint": "#aad600", "secondary-fixed-dim": "#c4c6d0", "secondary-container": "#44474f", "primary": "#ffffff", "on-tertiary-fixed": "#410004", "on-primary-container": "#556d00", "outline-variant": "#444934", "surface-dim": "#111317", "outline": "#8e937a", "inverse-surface": "#e2e2e8", "error-container": "#93000a", "on-tertiary": "#68000b" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-xl": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-md": "1rem", "space-lg": "1.5rem" }, "fontFamily": { "body-sm": ["Nunito Sans"], "label-md": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "body-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "timer-display": ["Nunito Sans"], "label-lg": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "headline-lg": ["Nunito Sans"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "800" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.3px", "fontWeight": "800" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "800" }], "timer-display": ["64px", { "lineHeight": "72px", "letterSpacing": "-1.5px", "fontWeight": "900" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "800" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.6px", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.5px", "fontWeight": "900" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-surface pt-safe pb-safe pl-safe pr-safe"><div class="flex flex-col w-full px-margin py-space-md min-h-[760px] justify-between relative select-none">
<!-- Top Navigation / Escape Hatch -->
<header class="flex items-center justify-between w-full pt-space-xs">
<button class="flex items-center gap-space-xs text-secondary hover:text-on-surface transition-colors min-h-[44px] min-w-[44px] -ml-2 px-2" onclick="handleCancel()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
<span class="font-label-md text-label-md">Batal</span>
</button>
<div class="flex items-center gap-1.5 px-space-sm py-1 rounded-full bg-surface-container">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary tracking-widest uppercase">Sensor Aktif</span>
</div>
</header>
<!-- Central Calibration Core -->
<main class="flex flex-col items-center justify-center my-auto w-full text-center py-space-sm">
<!-- Header Prompt -->
<div class="max-w-[320px] mx-auto mb-space-lg">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs tracking-tight">
        Letakkan HP datar di meja
      </h1>
<p class="font-body-md text-body-md text-secondary">
        Pastikan layar menghadap ke atas pada permukaan datar yang stabil.
      </p>
</div>
<!-- Giant Visual Countdown Ring & Gyroscope Reticle -->
<div class="relative w-64 h-64 flex items-center justify-center my-space-md">
<!-- Ambient Outer Pulse Field -->
<div class="absolute inset-0 rounded-full bg-primary-container/10 blur-xl scale-95 transition-transform duration-1000" id="pulse-halo"></div>
<!-- Surface Level Indicator Reticle Rings -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90 pointer-events-none" viewbox="0 0 256 256">
<!-- Track Circle -->
<circle cx="128" cy="128" fill="none" r="108" stroke="#1e2024" stroke-width="6"></circle>
<!-- Dynamic Progress Arc (circumference: 2 * PI * 108 = ~678.58) -->
<circle class="transition-all duration-1000 ease-linear" cx="128" cy="128" fill="none" id="countdown-progress" r="108" stroke="#c5f331" stroke-dasharray="678.58" stroke-dashoffset="0" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<!-- Tactical Horizon Crosshairs -->
<div class="absolute inset-x-8 top-1/2 h-px bg-surface-variant/40 -translate-y-1/2 pointer-events-none"></div>
<div class="absolute inset-y-8 left-1/2 w-px bg-surface-variant/40 -translate-x-1/2 pointer-events-none"></div>
<!-- Micro Bubble Level Center Target -->
<div class="absolute w-4 h-4 rounded-full bg-primary-fixed/20 flex items-center justify-center transition-all duration-300" id="gyro-bubble" style="transform: translate(1px, -2px);">
<div class="w-2 h-2 rounded-full bg-primary-fixed shadow-sm"></div>
</div>
<!-- Core Digits Display -->
<div class="relative z-10 flex flex-col items-center justify-center">
<span class="font-timer-display text-timer-display text-primary-fixed select-none transition-transform duration-300" id="countdown-number">
          3
        </span>
<div class="flex items-center gap-1.5 mt-1">
<span class="w-1.5 h-1.5 rounded-full bg-primary-fixed transition-colors" id="step-dot-1"></span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant transition-colors" id="step-dot-2"></span>
<span class="w-1.5 h-1.5 rounded-full bg-surface-variant transition-colors" id="step-dot-3"></span>
</div>
</div>
</div>
<!-- Live Surface Telemetry Chip -->
<div class="flex items-center gap-2 px-space-md py-space-xs rounded-full bg-surface-container mt-space-md shadow-sm">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-fixed opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary-fixed"></span>
</span>
<span class="font-label-sm text-label-sm text-on-surface tracking-wide" id="gyro-status-label">
        Sudut 0,2° • Stabil
      </span>
</div>
<!-- Steady State Warning -->
<p class="font-body-sm text-body-sm text-secondary mt-space-sm max-w-[260px]">
      Jangan sentuh HP selama 3 detik
    </p>
</main>
<!-- Bottom Actions & Permission Card -->
<footer class="flex flex-col w-full gap-space-sm pb-space-sm">
<!-- Android Background Service Advisory Tile -->
<div class="w-full bg-surface-container p-space-md rounded-2xl flex items-center justify-between cursor-pointer hover:bg-surface-container-high transition-colors" onclick="goToPermissions()">
<div class="flex items-center gap-space-sm min-w-0 pr-space-xs">
<div class="w-9 h-9 rounded-xl bg-surface-container-highest flex items-center justify-center flex-shrink-0 text-secondary">
<span class="material-symbols-outlined text-[20px]">admin_panel_settings</span>
</div>
<div class="flex flex-col text-left truncate">
<span class="font-label-md text-label-md text-on-surface truncate">Izin Pemantauan Latar Belakang</span>
<span class="font-body-sm text-body-sm text-secondary truncate">Atur toleransi sensor &amp; daya tahan</span>
</div>
</div>
<span class="material-symbols-outlined text-secondary flex-shrink-0 text-[20px]">arrow_forward</span>
</div>
<!-- Explicit Cancel Link Target -->
<div class="w-full flex items-center justify-center pt-space-xs">
<button class="w-full min-h-[48px] flex items-center justify-center font-label-lg text-label-lg text-secondary hover:text-on-surface transition-colors" onclick="handleCancel()" type="button">
        Batal
      </button>
</div>
</footer>
</div>
<script>
  (function () {
    let timeLeft = 3;
    const totalTime = 3;
    const circumference = 678.58;
    const countEl = document.getElementById('countdown-number');
    const ringEl = document.getElementById('countdown-progress');
    const bubbleEl = document.getElementById('gyro-bubble');
    const statusLabel = document.getElementById('gyro-status-label');
    const dot1 = document.getElementById('step-dot-1');
    const dot2 = document.getElementById('step-dot-2');
    const dot3 = document.getElementById('step-dot-3');

    // Subtle micro-gyro simulation
    let gyroInterval = setInterval(() => {
      const offsetX = (Math.random() * 4 - 2).toFixed(1);
      const offsetY = (Math.random() * 4 - 2).toFixed(1);
      const tilt = (Math.random() * 0.3 + 0.1).toFixed(1);
      if (bubbleEl) {
        bubbleEl.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
      }
      if (statusLabel && timeLeft > 0) {
        statusLabel.innerHTML = `Sudut ${tilt}&deg; &bull; Stabil`;
      }
    }, 450);

    const timer = setInterval(() => {
      timeLeft -= 1;
      const offset = circumference - (circumference * (totalTime - timeLeft)) / totalTime;
      if (ringEl) ringEl.style.strokeDashoffset = offset;

      if (countEl) {
        countEl.style.transform = 'scale(0.85)';
        setTimeout(() => {
          if (countEl) countEl.style.transform = 'scale(1)';
        }, 150);
      }

      if (timeLeft === 2) {
        if (countEl) countEl.textContent = '2';
        if (dot2) dot2.classList.replace('bg-surface-variant', 'bg-primary-fixed');
      } else if (timeLeft === 1) {
        if (countEl) countEl.textContent = '1';
        if (dot3) dot3.classList.replace('bg-surface-variant', 'bg-primary-fixed');
      } else if (timeLeft <= 0) {
        clearInterval(timer);
        clearInterval(gyroInterval);
        if (countEl) countEl.textContent = '0';
        if (statusLabel) {
          statusLabel.innerHTML = `Terkunci &bull; Memulai`;
        }
        // Direct transition cue to S09 Sesi Aktif
        setTimeout(() => {
          console.log('Navigating to S09 Sesi Aktif');
        }, 300);
      }
    }, 1000);

    window.handleCancel = function () {
      clearInterval(timer);
      clearInterval(gyroInterval);
      console.log('Cancelled calibration, navigating back to S07');
    };

    window.goToPermissions = function () {
      console.log('Navigating to S19 Pengaturan Izin Pemantauan');
    };
  })();
</script></main></body></html>
