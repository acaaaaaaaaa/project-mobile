<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;800;900&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;min-height:100vh;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "outline-variant": "#444934", "surface-dim": "#111317", "surface-container-low": "#1a1c20", "on-primary-fixed-variant": "#3b4d00", "tertiary-container": "#ffdad7", "surface-container-highest": "#333539", "on-background": "#e2e2e8", "secondary-fixed": "#e0e2ec", "surface-container-lowest": "#0c0e12", "on-secondary-container": "#b3b5be", "on-error": "#690005", "secondary-fixed-dim": "#c4c6d0", "on-secondary-fixed": "#191c22", "on-primary": "#283500", "on-surface": "#e2e2e8", "tertiary-fixed": "#ffdad7", "on-error-container": "#ffdad6", "secondary": "#c4c6d0", "secondary-container": "#44474f", "background": "#111317", "on-tertiary-fixed-variant": "#930014", "surface": "#111317", "primary": "#ffffff", "surface-tint": "#aad600", "surface-container-high": "#282a2e", "on-tertiary": "#68000b", "surface-container": "#1e2024", "primary-fixed": "#c5f331", "on-primary-fixed": "#161f00", "inverse-surface": "#e2e2e8", "primary-container": "#c5f331", "on-secondary": "#2d3038", "tertiary-fixed-dim": "#ffb3ae", "outline": "#8e937a", "primary-fixed-dim": "#aad600", "on-surface-variant": "#c4c9ae", "on-tertiary-container": "#c31f29", "inverse-on-surface": "#2f3035", "surface-bright": "#37393e", "on-primary-container": "#556d00", "on-secondary-fixed-variant": "#44474f", "tertiary": "#ffffff", "error-container": "#93000a", "inverse-primary": "#506600", "on-tertiary-fixed": "#410004", "surface-variant": "#333539", "error": "#ffb4ab" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-md": "1rem", "space-xl": "2rem", "space-xs": "0.25rem", "space-lg": "1.5rem", "space-sm": "0.5rem", "margin": "1.25rem", "gutter": "1rem" }, "fontFamily": { "timer-display": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "label-lg": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "body-md": ["Nunito Sans"], "headline-lg": ["Nunito Sans"], "body-sm": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "label-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"] }, "fontSize": { "timer-display": ["64px", { "lineHeight": "72px", "letterSpacing": "-1.5px", "fontWeight": "900" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.6px", "fontWeight": "800" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "800" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "800" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.5px", "fontWeight": "900" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.3px", "fontWeight": "800" }], "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "800" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-[#1B0A0C] min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-[#1B0A0C]"><div class="flex flex-col w-full px-5 py-4 min-h-[calc(100vh-theme(spacing.space-xl))] justify-between relative overflow-hidden select-none">
<!-- Subtle Ambient Pulse Glow in Background -->
<div class="absolute -top-24 left-1/2 -translate-x-1/2 w-96 h-96 bg-error-container/20 rounded-full blur-3xl pointer-events-none animate-pulse"></div>
<div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-72 h-72 bg-on-tertiary-container/10 rounded-full blur-2xl pointer-events-none"></div>
<!-- Top Status Badge Area -->
<header class="relative z-10 flex items-center justify-between w-full pt-2">
<div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-error-container/40">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-error"></span>
</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider text-error">ALARM AKTIF</span>
</div>
<div class="flex items-center gap-1.5 text-tertiary-fixed-dim/70">
<span class="material-symbols-outlined text-[16px]">schedule</span>
<span class="font-body-sm text-body-sm tracking-tight">menit ke-28:14</span>
</div>
</header>
<!-- Center Warning & Visual Graphic -->
<section class="relative z-10 flex flex-col items-center text-center my-auto py-6">
<!-- Pulsing Geometric Alert Beacon -->
<div class="relative flex items-center justify-center w-36 h-36 mb-8">
<div class="absolute inset-0 rounded-full bg-error/10 animate-ping duration-1000"></div>
<div class="absolute inset-2 rounded-full bg-surface-container-lowest/60 backdrop-blur-sm"></div>
<div class="relative w-28 h-28 rounded-3xl bg-surface-container-low flex items-center justify-center shadow-lg">
<!-- High-Impact Stroke Icon (Phone Tilt Trigger) -->
<svg class="w-14 h-14 text-error" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M14 6H34C35.1046 6 36 6.89543 36 8V40C36 41.1046 35.1046 42 34 42H14C12.8954 42 12 41.1046 12 40V8C12 6.89543 12.8954 6 14 6Z" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M21 37H27" stroke="currentColor" stroke-linecap="round" stroke-width="2.5"></path>
<path d="M24 14V24" stroke="currentColor" stroke-linecap="round" stroke-width="2.75"></path>
<circle cx="24" cy="29" fill="currentColor" r="1.5"></circle>
</svg>
</div>
</div>
<!-- Alarm Typography -->
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2.5">
      Kamu mengangkat HP!
    </h1>
<p class="font-body-md text-body-md text-tertiary-fixed-dim/80 max-w-[280px] leading-relaxed">
      Teman sekelompokmu sudah diberi tahu. Timer tetap berjalan.
    </p>
</section>
<!-- Telemetry & Sensor Stats Grid -->
<section class="relative z-10 w-full mb-6">
<div class="grid grid-cols-3 gap-2.5 w-full">
<!-- Tile 1: Sudut Terdeteksi -->
<div class="flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low/80 backdrop-blur-sm text-center">
<span class="font-headline-md text-headline-md text-error tracking-tight font-extrabold">31°</span>
<span class="font-label-sm text-label-sm text-tertiary-fixed-dim/60 mt-0.5">Sudut</span>
</div>
<!-- Tile 2: Ambang Toleransi -->
<div class="flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low/80 backdrop-blur-sm text-center">
<span class="font-headline-md text-headline-md text-on-surface tracking-tight font-extrabold">15°</span>
<span class="font-label-sm text-label-sm text-tertiary-fixed-dim/60 mt-0.5">Toleransi</span>
</div>
<!-- Tile 3: Frekuensi Pelanggaran -->
<div class="flex flex-col items-center justify-center py-3.5 px-2 rounded-2xl bg-surface-container-low/80 backdrop-blur-sm text-center">
<span class="font-headline-md text-headline-md text-on-surface tracking-tight font-extrabold">2x</span>
<span class="font-label-sm text-label-sm text-tertiary-fixed-dim/60 mt-0.5 leading-tight">Pelanggaran</span>
</div>
</div>
</section>
<!-- Bottom CTA Container -->
<footer class="relative z-10 flex flex-col items-center w-full gap-3 pb-2">
<!-- Tactile Lime Primary Button with Physical Shadow Translation -->
<button class="w-full h-[54px] rounded-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_4px_0_#9EC41C] active:translate-y-[3px] active:shadow-[0_1px_0_#9EC41C] transition-transform" id="recalibrate-btn">
<span class="material-symbols-outlined text-[20px]">screen_rotation</span>
<span>Taruh HP &amp; Kalibrasi Ulang</span>
</button>
<!-- Microcopy / Protocol Instruction -->
<p class="font-body-sm text-body-sm text-tertiary-fixed-dim/50 text-center tracking-normal">
      Sensor akan diverifikasi kembali selama 3 detik di atas meja.
    </p>
</footer>
</div>
<script>
  (function() {
    const btn = document.getElementById('recalibrate-btn');
    if (!btn) return;

    btn.addEventListener('click', function() {
      // Tactile physical feedback
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate([30, 40, 30]);
      }
      btn.innerText = 'Menunggu Peletakan Ponsel...';
      btn.classList.add('opacity-80', 'pointer-events-none');
    });
  })();
</script></main></body></html>
