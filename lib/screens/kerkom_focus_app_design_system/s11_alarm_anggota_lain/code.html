  </head><body class="bg-[#1B0A0C] min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-[#1B0A0C]"><div class="flex flex-col w-full px-margin pb-space-lg select-none">

</div>

<button class="w-full h-[52px] rounded-full bg-primary text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-transform duration-100" id="btn-dismiss-alarm" style="box-shadow: 0 4px 0 #aad600;" type="button">
<span class="material-symbols-outlined text-[20px]">check_circle</span>

</button>
<!-- Contextual System Status Indicator -->
<p class="font-body-sm text-body-sm text-tertiary-fixed-dim/60 text-center pt-space-xs">
      Sesi grup tetap berlangsung otomatis.
    </p>
</div>
</div>
<script>
  // Interactive tactile feedback for dismissal button
  const dismissBtn = document.getElementById('btn-dismiss-alarm');
  if (dismissBtn) {
    dismissBtn.addEventListener('mousedown', () => {
      dismissBtn.style.transform = 'translateY(3px)';
      dismissBtn.style.boxShadow = '0 1px 0 #aad600';
    });
    const resetBtn = () => {
      dismissBtn.style.transform = 'translateY(0px)';
      dismissBtn.style.boxShadow = '0 4px 0 #aad600';
    };
    dismissBtn.addEventListener('mouseup', resetBtn);
    dismissBtn.addEventListener('mouseleave', resetBtn);
    dismissBtn.addEventListener('touchend', resetBtn);
  }
</script></main></body></html>
