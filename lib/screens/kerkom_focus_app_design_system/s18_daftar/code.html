  </head><body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-surface px-margin"><div class="flex flex-col w-full pb-6">
<!-- Top Bar / Navigation -->
<div class="flex items-center justify-between py-2">
<button aria-label="Kembali ke layar masuk" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-low text-primary active:scale-95 transition-transform" onclick="window.history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">arrow_back</span>
</button>
<div class="flex items-center gap-1.5 opacity-90">
<div class="w-2 h-2 rounded-full bg-primary-fixed"></div>
<span class="text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider">Registrasi</span>
</div>
</div>
<!-- Headline & Brand Context -->
<div class="mt-4 mb-5">
<div class="flex items-center gap-2 mb-1.5">
<span class="text-primary-fixed font-headline-md text-headline-md tracking-tight">kerkom</span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-primary-fixed"></span>
</div>
<h1 class="text-primary font-headline-lg text-headline-lg">Buat akun Kerkom</h1>
<p class="text-secondary font-body-sm text-body-sm mt-1">
      Mulai sesi kerja kelompok fokus bersama teman.
    </p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-3.5" id="register-form" onsubmit="event.preventDefault();">
<!-- Nama Tampilan -->
<div class="flex flex-col gap-1.5">
<label class="text-on-surface font-label-md text-label-md" for="display-name">
        Nama tampilan
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] bg-surface-container-low text-primary font-body-md text-body-md px-4 rounded-xl placeholder:text-secondary focus:outline-none focus:ring-1 focus:ring-primary-fixed transition-all" id="display-name" placeholder="Contoh: Budi Santoso" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="text-on-surface font-label-md text-label-md" for="email">
        Email
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] bg-surface-container-low text-primary font-body-md text-body-md px-4 rounded-xl placeholder:text-secondary focus:outline-none focus:ring-1 focus:ring-primary-fixed transition-all" id="email" placeholder="nama@kampus.ac.id" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="text-on-surface font-label-md text-label-md" for="password">
        Password
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] bg-surface-container-low text-primary font-body-md text-body-md pl-4 pr-12 rounded-xl placeholder:text-secondary focus:outline-none focus:ring-1 focus:ring-primary-fixed transition-all" id="password" minlength="8" placeholder="••••••••" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan password" class="absolute right-3 w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors" id="toggle-pwd" onclick="const p = document.getElementById('password'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<span class="text-secondary font-label-sm text-label-sm">Minimal 8 karakter</span>
</div>
<!-- Konfirmasi Password -->
<div class="flex flex-col gap-1.5">
<label class="text-on-surface font-label-md text-label-md" for="confirm-password">
        Konfirmasi password
      </label>
<div class="relative flex items-center">
<input class="w-full h-[52px] bg-surface-container-low text-primary font-body-md text-body-md pl-4 pr-12 rounded-xl placeholder:text-secondary focus:outline-none focus:ring-1 focus:ring-primary-fixed transition-all" id="confirm-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Tampilkan atau sembunyikan konfirmasi password" class="absolute right-3 w-8 h-8 flex items-center justify-center text-secondary hover:text-primary transition-colors" id="toggle-conf-pwd" onclick="const p = document.getElementById('confirm-password'); const icon = this.querySelector('span'); if (p.type === 'password') { p.type = 'text'; icon.textContent = 'visibility_off'; } else { p.type = 'password'; icon.textContent = 'visibility'; }" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-2">
<button class="w-full h-[52px] rounded-2xl bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center tracking-normal active:translate-y-[3px] transition-transform" style="box-shadow: 0 4px 0 #9EC41C;" type="submit">
        Buat Akun
      </button>
</div>
</form>
<!-- Divider -->
<div class="flex items-center my-4">
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
<span class="text-secondary font-label-sm text-label-sm px-3 uppercase tracking-wider">atau</span>
<div class="flex-1 h-[1px] bg-surface-container-highest"></div>
</div>
<!-- Secondary Google Button -->
<button class="w-full h-[50px] rounded-2xl bg-primary text-surface-container-lowest font-label-lg text-body-md flex items-center justify-center gap-3 active:scale-[0.99] transition-transform" type="button">
<svg aria-hidden="true" class="w-5 h-5 flex-shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-headline-sm text-body-md text-surface-dim font-extrabold">Daftar dengan Google</span>
</button>
<!-- Bottom Navigation Link & Policy -->
<div class="mt-5 text-center flex flex-col items-center">
<p class="text-secondary font-body-sm text-body-sm">
      Sudah punya akun? 
      <a class="text-primary-fixed font-label-md text-label-md hover:underline ml-1" href="#masuk">
        Masuk
      </a>
</p>
<p class="mt-3 text-secondary/80 font-label-sm text-label-sm max-w-[280px] leading-relaxed">
      Dengan mendaftar, kamu menyetujui Syarat dan Kebijakan Privasi
    </p>
</div>
</div></main></body></html>
