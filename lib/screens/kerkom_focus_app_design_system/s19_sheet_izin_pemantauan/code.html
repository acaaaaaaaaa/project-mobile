<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;min-height:100vh;margin:0;padding:0;background-color:#111317;color:#e2e2e8;overscroll-behavior-y:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.pl-safe{padding-left:env(safe-area-inset-left,0px);}.pr-safe{padding-right:env(safe-area-inset-right,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary": "#ffffff", "surface-container-high": "#282a2e", "surface-container": "#1e2024", "primary-fixed": "#c5f331", "on-tertiary-container": "#c31f29", "on-error-container": "#ffdad6", "surface-variant": "#333539", "on-secondary-container": "#b3b5be", "on-background": "#e2e2e8", "on-secondary-fixed-variant": "#44474f", "surface-container-lowest": "#0c0e12", "tertiary-fixed-dim": "#ffb3ae", "surface": "#111317", "on-surface": "#e2e2e8", "secondary": "#c4c6d0", "background": "#111317", "on-error": "#690005", "inverse-primary": "#506600", "surface-container-highest": "#333539", "tertiary-container": "#ffdad7", "on-tertiary-fixed-variant": "#930014", "on-secondary-fixed": "#191c22", "surface-container-low": "#1a1c20", "on-primary-fixed": "#161f00", "error": "#ffb4ab", "primary-fixed-dim": "#aad600", "tertiary-fixed": "#ffdad7", "secondary-fixed": "#e0e2ec", "on-surface-variant": "#c4c9ae", "on-primary": "#283500", "on-primary-fixed-variant": "#3b4d00", "on-secondary": "#2d3038", "primary-container": "#c5f331", "surface-bright": "#37393e", "inverse-on-surface": "#2f3035", "surface-tint": "#aad600", "secondary-fixed-dim": "#c4c6d0", "secondary-container": "#44474f", "primary": "#ffffff", "on-tertiary-fixed": "#410004", "on-primary-container": "#556d00", "outline-variant": "#444934", "surface-dim": "#111317", "outline": "#8e937a", "inverse-surface": "#e2e2e8", "error-container": "#93000a", "on-tertiary": "#68000b" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-sm": "0.5rem", "space-xl": "2rem", "gutter": "1rem", "space-xs": "0.25rem", "margin": "1.25rem", "space-md": "1rem", "space-lg": "1.5rem" }, "fontFamily": { "body-sm": ["Nunito Sans"], "label-md": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "body-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "timer-display": ["Nunito Sans"], "label-lg": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "headline-lg": ["Nunito Sans"] }, "fontSize": { "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "800" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.3px", "fontWeight": "800" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "800" }], "timer-display": ["64px", { "lineHeight": "72px", "letterSpacing": "-1.5px", "fontWeight": "900" }], "label-lg": ["16px", { "lineHeight": "20px", "fontWeight": "800" }], "label-sm": ["11px", { "lineHeight": "14px", "letterSpacing": "0.6px", "fontWeight": "800" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.5px", "fontWeight": "900" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 inset-x-0 z-50 bg-surface/85 backdrop-blur-xl pt-safe"><div class="h-14 px-margin flex items-center justify-between"><button aria-label="Kembali" class="w-11 h-11 -ml-space-xs flex items-center justify-center rounded-lg text-on-surface hover:text-primary-fixed focus:outline-none transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight truncate max-w-[200px]">Session Setup</h1><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-14 pb-safe bg-surface"><div class="flex flex-col w-full relative -mx-margin px-margin min-h-[calc(100vh-3.5rem)] justify-end overflow-hidden">
<!-- Dimmed S08 Background Simulation (Simulated Underlay) -->
<div aria-hidden="true" class="absolute inset-0 bg-surface-container-lowest/80 backdrop-blur-sm z-0 flex flex-col p-space-md opacity-40 pointer-events-none select-none">
<div class="flex items-center justify-between mt-2">
<div class="w-24 h-4 bg-surface-container rounded"></div>
<div class="w-16 h-6 bg-surface-container-high rounded-full"></div>
</div>
<div class="my-auto flex flex-col items-center justify-center">
<div class="w-56 h-56 rounded-full bg-surface-container flex items-center justify-center mb-6">
<span class="font-timer-display text-timer-display text-on-surface/30">25:00</span>
</div>
<div class="w-48 h-5 bg-surface-container-high rounded mb-2"></div>
<div class="w-32 h-4 bg-surface-container rounded"></div>
</div>
<div class="w-full h-14 bg-surface-container rounded-2xl mb-4"></div>
</div>
<!-- Bottom Sheet Container (Level 2 Elevation: surface-container-high #282a2e) -->
<section aria-labelledby="sheet-title" aria-modal="true" class="relative z-10 w-full bg-surface-container-high rounded-t-[28px] px-margin pt-3 pb-space-lg flex flex-col shadow-2xl transition-all" id="permission-sheet" role="dialog">
<!-- Top Drag Handle & Close Button Row -->
<div class="relative w-full flex items-center justify-center pt-1 pb-2">
<!-- Drag Handle Pill -->
<div aria-hidden="true" class="w-10 h-1.5 bg-surface-variant rounded-full"></div>
<!-- Close Icon Button -->
<button aria-label="Tutup dialog" class="absolute right-0 top-0 w-11 h-11 flex items-center justify-center rounded-full text-secondary hover:text-on-surface active:bg-surface-variant transition-colors" id="btn-close-sheet" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Title and Subtitle Block -->
<div class="flex flex-col mt-2 mb-space-lg">
<div class="flex items-center gap-2 mb-1.5">
<span class="material-symbols-outlined text-primary-fixed text-[20px]" style="font-variation-settings: 'FILL' 1;">screen_lock_portrait</span>
<span class="font-label-sm text-label-sm text-primary-fixed uppercase tracking-wider">Izin Latar Belakang</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface" id="sheet-title">
        Pantau sesi saat layar mati?
      </h2>
<p class="font-body-md text-body-md text-secondary mt-1.5 leading-relaxed">
        Kerkom perlu tetap berjalan di latar belakang supaya HP yang terangkat tetap terdeteksi saat layar mati. Notifikasi sesi tampil selama sesi berlangsung.
      </p>
</div>
<!-- Radio Options Stack -->
<div aria-labelledby="sheet-title" class="flex flex-col gap-3 mb-space-lg" role="radiogroup">
<!-- Option 1: Selalu (Default Selected) -->
<label class="radio-card group cursor-pointer flex items-start gap-3.5 p-space-md rounded-2xl bg-surface-container transition-all select-none" data-option-val="selalu">
<div class="pt-0.5 flex-shrink-0">
<input checked="" class="sr-only" name="monitoring_mode" type="radio" value="selalu"/>
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-primary-fixed scale-100 transition-transform"></div>
</div>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<span class="font-label-lg text-label-lg text-on-surface">Selalu</span>
<span class="font-label-sm text-label-sm text-primary-fixed bg-surface-variant px-2 py-0.5 rounded-md">Direkomendasikan</span>
</div>
<p class="font-body-sm text-body-sm text-secondary mt-1">
            Langsung aktif tiap sesi. Kerkom meminta pengecualian hemat baterai agar tidak dimatikan sistem.
          </p>
</div>
</label>
<!-- Option 2: Saat sesi berjalan -->
<label class="radio-card group cursor-pointer flex items-start gap-3.5 p-space-md rounded-2xl bg-surface-container transition-all select-none" data-option-val="sesi">
<div class="pt-0.5 flex-shrink-0">
<input class="sr-only" name="monitoring_mode" type="radio" value="sesi"/>
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-primary-fixed scale-0 transition-transform"></div>
</div>
</div>
<div class="flex-1 min-w-0">
<span class="font-label-lg text-label-lg text-on-surface">Saat sesi berjalan</span>
<p class="font-body-sm text-body-sm text-secondary mt-1">
            Aktif otomatis hanya selama sesi berlangsung.
          </p>
</div>
</label>
<!-- Option 3: Sekali saja -->
<label class="radio-card group cursor-pointer flex items-start gap-3.5 p-space-md rounded-2xl bg-surface-container transition-all select-none" data-option-val="sekali">
<div class="pt-0.5 flex-shrink-0">
<input class="sr-only" name="monitoring_mode" type="radio" value="sekali"/>
<div class="radio-indicator w-5 h-5 rounded-full bg-surface-variant flex items-center justify-center transition-colors">
<div class="radio-dot w-2.5 h-2.5 rounded-full bg-primary-fixed scale-0 transition-transform"></div>
</div>
</div>
<div class="flex-1 min-w-0">
<span class="font-label-lg text-label-lg text-on-surface">Sekali saja</span>
<p class="font-body-sm text-body-sm text-secondary mt-1">
            Hanya untuk sesi ini, ditanya lagi lain kali.
          </p>
</div>
</label>
</div>
<!-- Action Buttons Block -->
<div class="flex flex-col w-full gap-2 pt-1">
<!-- Tactile Solid-Offset Primary Button -->
<button class="w-full h-12 rounded-xl bg-primary-fixed text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center shadow-[0_4px_0_#9EC41C] active:translate-y-[3px] active:shadow-[0_1px_0_#9EC41C] transition-transform duration-75 select-none" id="btn-confirm-permission" type="button">
<span>Lanjutkan</span>
</button>
<!-- Secondary Decline Action -->
<button class="w-full min-h-[44px] flex flex-col items-center justify-center py-2 text-secondary hover:text-on-surface active:text-on-surface transition-colors" id="btn-deny-permission" type="button">
<span class="font-label-md text-label-md">Jangan izinkan</span>
<span class="font-label-sm text-label-sm text-secondary/70 mt-0.5">Sesi membutuhkan layar tetap menyala</span>
</button>
</div>
</section>
</div>
<script>
  (function initPermissionSheet() {
    const radioCards = document.querySelectorAll('.radio-card');
    const confirmBtn = document.getElementById('btn-confirm-permission');
    const denyBtn = document.getElementById('btn-deny-permission');
    const closeBtn = document.getElementById('btn-close-sheet');

    // Sync card visuals on radio switch
    function updateRadioStates() {
      radioCards.forEach(card => {
        const input = card.querySelector('input[type="radio"]');
        const indicator = card.querySelector('.radio-indicator');
        const dot = card.querySelector('.radio-dot');

        if (input.checked) {
          card.classList.remove('bg-surface-container');
          card.classList.add('bg-surface-variant');
          indicator.classList.remove('bg-surface-variant');
          indicator.classList.add('bg-surface-container-lowest');
          dot.classList.remove('scale-0');
          dot.classList.add('scale-100');
        } else {
          card.classList.add('bg-surface-container');
          card.classList.remove('bg-surface-variant');
          indicator.classList.add('bg-surface-variant');
          indicator.classList.remove('bg-surface-container-lowest');
          dot.classList.add('scale-0');
          dot.classList.remove('scale-100');
        }
      });
    }

    radioCards.forEach(card => {
      card.addEventListener('click', () => {
        const input = card.querySelector('input[type="radio"]');
        input.checked = true;
        updateRadioStates();
      });
    });

    // Check query params if opened from settings (S16) vs focus launch (S08)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('from') === 'S16' && confirmBtn) {
      confirmBtn.querySelector('span').textContent = 'Simpan';
    }

    function returnToPrevious() {
      if (window.history.length > 1) {
        window.history.back();
      }
    }

    confirmBtn.addEventListener('click', returnToPrevious);
    denyBtn.addEventListener('click', returnToPrevious);
    closeBtn.addEventListener('click', returnToPrevious);

    // Initial styling setup
    updateRadioStates();
  })();
</script></main></body></html>
